<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061426"><meta name="description" content="Search The Shop Songbook by artist, song title, or guitar tuning."><title>The Shop Songbook</title><link rel="icon" type="image/png" href="logo.png"><style>
*{box-sizing:border-box}:root{--panel:#0a2039;--line:#1e4a73;--text:#f4f8ff;--muted:#9bb4d0;--cyan:#20c9ff}html{scroll-behavior:smooth;color-scheme:dark}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 72% 12%,#0d477055,transparent 30%),linear-gradient(145deg,#03101f,#061a31 56%,#04101f);min-height:100vh}button,input,select,a{font:inherit}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 15px;border-right:1px solid #153957;background:#031325f2;z-index:30}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 26px}.brand img{width:58px;height:58px;object-fit:contain}.brand-text{font-weight:850;line-height:.92;font-size:18px;min-width:0;white-space:nowrap}.brand-text span{display:block;color:var(--cyan);font-size:21px;letter-spacing:-.02em}.nav{display:grid;gap:7px}.nav a,.nav button{display:flex;align-items:center;gap:12px;min-height:46px;width:100%;padding:11px 14px;border:1px solid transparent;border-radius:10px;color:#b8cce2;background:transparent;text-decoration:none;text-align:left;cursor:pointer}.nav a:hover,.nav button:hover,.nav .active{background:#102d50;border-color:#1a4773;color:#fff}.ico{width:22px;color:var(--cyan);font-size:18px}.main{min-width:0}.hero{padding:50px 48px 28px;border-bottom:1px solid #173b5c}.hero h1{font-size:clamp(43px,6vw,78px);line-height:.95;margin:0 0 24px;letter-spacing:-.045em}.hero h1 span{color:var(--cyan);text-shadow:0 0 24px #19c6ff66}.tagline{color:#bfd0e5;font-size:17px;margin:0 0 32px}.search{display:flex;align-items:center;gap:12px;width:min(980px,100%);border:1px solid #4fa9e5;background:#0b2847cc;border-radius:30px;padding:0 20px}.search input{width:100%;height:58px;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.stats{display:flex;gap:48px;flex-wrap:wrap;margin:24px 3px 0}.stat strong{font-size:24px}.stat small{display:block;color:#a9bfd8}.updated{margin-top:13px;color:#9ab4cf;font-size:13px}.content{padding:20px 28px 62px}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:11px 8px;background:#051527e8;border-bottom:1px solid #133b5d;backdrop-filter:blur(14px)}.toolbar select,.toolbar button{height:42px;border:1px solid #2c6390;border-radius:10px;background:#0b2745;color:#e8f3ff;padding:0 13px;cursor:pointer}.views{margin-left:auto;display:flex;gap:5px}.views button.active{background:#0a527d;color:var(--cyan)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid #2983b5;background:#0b3658;color:#dff7ff;border-radius:999px;padding:7px 11px;cursor:pointer}.results{color:#8faccc;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px}.card{padding:17px;background:linear-gradient(145deg,#0a2039,#0a1b31);border:1px solid var(--line);border-radius:12px;box-shadow:0 9px 26px #0003;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#2b78a8}.artist{padding:0;border:0;background:none;color:var(--cyan);font-weight:800;cursor:pointer}.title{font-size:18px;font-weight:800;margin:5px 0 13px}.badges{display:flex;gap:7px;flex-wrap:wrap}.pill{min-height:28px;border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none;border:1px solid #3f75a5;background:#173b61;color:#e7f3ff}.pill.tuning{cursor:pointer}.pill.lyrics{border-color:#29894d;background:#0d6b31}.pill.nolyrics{border-color:#54697d;background:#172b42;color:#c0cedb}.directory{display:none;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}.directory.show{display:grid}.dircard{padding:18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#0a2039,#0a192b);cursor:pointer;color:#fff;text-align:left}.dircard strong{display:block;color:var(--cyan)}.dircard span{color:#8eabc8;font-size:13px}.arrow{float:right;color:var(--cyan)}.more{display:block;margin:24px auto 0;padding:12px 22px;border:1px solid #2e7dab;border-radius:999px;background:#0a3659;color:#fff;cursor:pointer}.top{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border:1px solid #2e83b6;border-radius:50%;background:#092c4b;color:#fff;opacity:0;visibility:hidden}.top.show{opacity:1;visibility:visible}.mobile{display:none;position:sticky;top:0;z-index:40;padding:10px 14px;background:#041426f3;border-bottom:1px solid #183c5c}.mobile img{width:34px;height:34px;object-fit:contain}.hamb{border:1px solid #25567e;border-radius:9px;background:#0b2947;color:#fff;padding:8px 12px}.skeleton{height:132px;border-radius:12px;background:linear-gradient(90deg,#0a1d33 25%,#123556 38%,#0a1d33 63%);background-size:400% 100%;animation:shine 1.25s infinite}@keyframes shine{to{background-position:-400% 0}}@media(max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}.directory{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.app{display:block}.mobile{display:flex;justify-content:space-between;align-items:center}.sidebar{position:fixed;left:0;top:59px;bottom:0;width:265px;height:auto;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}.hero{padding:34px 18px 24px}.content{padding:14px 12px}.toolbar{top:59px}.grid{grid-template-columns:1fr}.directory{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.hero h1{font-size:40px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar select,.toolbar button{width:100%}.views{grid-column:1/-1;margin:0}.directory{grid-template-columns:1fr}}
</style></head><body><div class="mobile"><button id="hamb" class="hamb">☰</button><strong>THE SHOP SONGBOOK</strong><img src="logo.png" alt="The Shop Songbook logo"></div><div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><img src="logo.png" alt="The Shop Songbook logo"><div class="brand-text">THE SHOP<span>SONGBOOK</span></div></div><nav class="nav"><a href="https://datadragontechnologies.com/"><span class="ico">←</span>Back to Data Dragon</a><button class="active" data-mode="songs"><span class="ico">♫</span>Songs</button><button data-mode="artists"><span class="ico">♙</span>Artists</button><button data-mode="tunings"><span class="ico">♯</span>Tunings</button></nav></aside><main class="main"><section class="hero"><h1>Find your next <span>song.</span></h1><p class="tagline">Find songs, lyrics, and tunings.</p><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search songs, artists, or tunings…"></label><div class="stats"><div class="stat"><strong id="songCount">—</strong><small>Songs</small></div><div class="stat"><strong id="artistCount">—</strong><small>Artists</small></div><div class="stat"><strong id="tuningCount">—</strong><small>Tunings</small></div></div><div id="updated" class="updated"></div></section><section class="content"><div class="toolbar"><select id="tun"><option value="">All Tunings</option></select><select id="sort"><option value="artist-asc">Artist A–Z</option><option value="artist-desc">Artist Z–A</option><option value="song-asc">Song A–Z</option><option value="song-desc">Song Z–A</option></select><button id="reset">Reset</button><div class="views"><button id="songView" class="active">Songs</button><button id="artistView">Artists</button><button id="tuningView">Tunings</button></div></div><div id="chips" class="chips"></div><p id="results" class="results">Loading songbook…</p><div id="grid" class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="directory" class="directory"></div><button id="more" class="more" hidden>Load more songs</button></section></main></div><button id="topButton" class="top">↑</button><script>
const API='https://script.google.com/macros/s/AKfycbwx8QaJURMxKnvVJ9aV5MYCq6FuT3kHE9DA51zuNl5wvmCgWgK48yWqPHVMevNw_0k8/exec',PAGE=60,$=s=>document.querySelector(s),q=$('#q'),tf=$('#tun'),sf=$('#sort'),grid=$('#grid'),dir=$('#directory'),more=$('#more'),results=$('#results');let songs=[],visible=PAGE,artistFilter='',tuningFilter='',mode='songs',updatedAt='';const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),lyrics=s=>'https://www.google.com/search?'+new URLSearchParams({q:`${s.artist} ${s.title} lyrics`});function updateUrl(){const p=new URLSearchParams();if(artistFilter)p.set('artist',artistFilter);if(tuningFilter)p.set('tuning',tuningFilter);if(q.value.trim())p.set('search',q.value.trim());if(mode!=='songs')p.set('view',mode);history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''))}function fromUrl(){const p=new URLSearchParams(location.search);artistFilter=p.get('artist')||'';tuningFilter=p.get('tuning')||'';q.value=p.get('search')||'';mode=['artists','tunings'].includes(p.get('view'))?p.get('view'):'songs'}function tunes(src=songs){return[...new Set(src.flatMap(s=>String(s.tuning||'Unknown Tuning').split(',').map(x=>x.trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function filtered(){const text=norm(q.value),t=tuningFilter||tf.value;let a=songs.filter(s=>(!text||norm(`${s.artist} ${s.title} ${s.tuning} ${s.searchAliases||''}`).includes(text))&&(!artistFilter||s.artist===artistFilter)&&(!t||String(s.tuning).split(',').map(x=>x.trim()).includes(t)));a.sort((x,y)=>{const aa=norm(x.artist).localeCompare(norm(y.artist))||norm(x.title).localeCompare(norm(y.title)),ss=norm(x.title).localeCompare(norm(y.title))||norm(x.artist).localeCompare(norm(y.artist));return sf.value==='artist-asc'?aa:sf.value==='artist-desc'?-aa:sf.value==='song-asc'?ss:-ss});return a}function showChips(){const a=[];if(artistFilter)a.push(`<button class="chip" data-clear="artist">Artist: ${esc(artistFilter)} ×</button>`);if(tuningFilter||tf.value)a.push(`<button class="chip" data-clear="tuning">Tuning: ${esc(tuningFilter||tf.value)} ×</button>`);if(q.value.trim())a.push(`<button class="chip" data-clear="search">Search: ${esc(q.value.trim())} ×</button>`);$('#chips').innerHTML=a.join('')}function songsView(){const a=filtered(),page=a.slice(0,visible);grid.style.display='grid';dir.classList.remove('show');grid.innerHTML=page.map(s=>`<article class="card"><button class="artist" data-artist="${esc(s.artist)}">${esc(s.artist)}</button><div class="title">${esc(s.title)}</div><div class="badges">${String(s.tuning).split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<button class="pill tuning" data-tuning="${esc(x)}">${esc(x)}</button>`).join('')}<a class="pill ${s.hasLyrics?'lyrics':'nolyrics'}" href="${lyrics(s)}" target="_blank" rel="noopener">${s.hasLyrics?'Lyrics ↗':'Find Lyrics ↗'}</a></div></article>`).join('')||'<div>No matching songs.</div>';results.textContent=`Showing ${page.length.toLocaleString()} of ${a.length.toLocaleString()} matching songs`;more.hidden=visible>=a.length;showChips()}function directoryView(kind){const m=new Map();filtered().forEach(s=>{if(kind==='artists')m.set(s.artist,(m.get(s.artist)||0)+1);else String(s.tuning).split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>m.set(t,(m.get(t)||0)+1))});const items=[...m].sort((a,b)=>a[0].localeCompare(b[0]));grid.style.display='none';dir.classList.add('show');dir.innerHTML=items.map(([name,n])=>`<button class="dircard" data-directory-${kind==='artists'?'artist':'tuning'}="${esc(name)}"><span class="arrow">→</span><strong>${esc(name)}</strong><span>${n.toLocaleString()} ${n===1?'song':'songs'}</span></button>`).join('');results.textContent=`${items.length.toLocaleString()} ${kind}`;more.hidden=true;showChips()}function render(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('#songView').classList.toggle('active',mode==='songs');$('#artistView').classList.toggle('active',mode==='artists');$('#tuningView').classList.toggle('active',mode==='tunings');mode==='songs'?songsView():directoryView(mode);updateUrl()}function refreshTunings(){const vals=tunes();tf.innerHTML='<option value="">All Tunings</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join('');tf.value=tuningFilter||''}async function load(){try{const cached=localStorage.getItem('shopSongbookCache');if(cached){const c=JSON.parse(cached);if(Array.isArray(c.songs)){songs=c.songs;updatedAt=c.updatedAt||'';after()}}const r=await fetch(API,{cache:'no-store'}),d=await r.json();songs=d.songs||[];updatedAt=d.updatedAt||d.generatedAt||'';localStorage.setItem('shopSongbookCache',JSON.stringify({songs,updatedAt}));after()}catch(e){if(!songs.length)results.textContent='Songbook unavailable.'}}function after(){fromUrl();$('#songCount').textContent=songs.length.toLocaleString();$('#artistCount').textContent=new Set(songs.map(s=>s.artist)).size.toLocaleString();$('#tuningCount').textContent=tunes().length.toLocaleString();if(updatedAt){const d=new Date(updatedAt);$('#updated').textContent=!isNaN(d)?`Songbook updated ${d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}`:''}refreshTunings();render()}q.oninput=()=>{artistFilter='';visible=PAGE;render()};tf.onchange=()=>{tuningFilter=tf.value;visible=PAGE;render()};sf.onchange=()=>{visible=PAGE;render()};$('#reset').onclick=()=>{q.value='';artistFilter='';tuningFilter='';tf.value='';sf.value='artist-asc';visible=PAGE;render()};more.onclick=()=>{visible+=PAGE;render()};$('#songView').onclick=()=>{mode='songs';render()};$('#artistView').onclick=()=>{mode='artists';render()};$('#tuningView').onclick=()=>{mode='tunings';render()};document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;render();if(innerWidth<=820)$('#sidebar').classList.remove('open')}const a=e.target.closest('[data-artist],[data-directory-artist]');if(a){artistFilter=a.dataset.artist||a.dataset.directoryArtist;mode='songs';visible=PAGE;render()}const t=e.target.closest('[data-tuning],[data-directory-tuning]');if(t){tuningFilter=t.dataset.tuning||t.dataset.directoryTuning;tf.value=tuningFilter;mode='songs';visible=PAGE;render()}const c=e.target.closest('[data-clear]');if(c){if(c.dataset.clear==='artist')artistFilter='';if(c.dataset.clear==='tuning'){tuningFilter='';tf.value=''}if(c.dataset.clear==='search')q.value='';render()}});$('#hamb').onclick=()=>$('#sidebar').classList.toggle('open');addEventListener('scroll',()=>$('#topButton').classList.toggle('show',scrollY>450),{passive:true});$('#topButton').onclick=()=>scrollTo({top:0,behavior:'smooth'});load();
</script></body></html>
